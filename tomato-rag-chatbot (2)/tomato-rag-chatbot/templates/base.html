<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomato - Restaurant Chat & Order Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #ee5a24;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --info-color: #17a2b8;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --border-color: #dee2e6;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark-color);
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 320px;
            background: white;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .sidebar.collapsed {
            transform: translateX(-100%);
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--light-color);
        }
        
        .header {
            background: white;
            padding: 15px 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .search-bar {
            position: relative;
            flex: 1;
            max-width: 500px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--info-color);
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .cart-button {
            position: relative;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .cart-button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger-color);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }
        
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            margin: 20px;
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 400px;
            background: var(--light-color);
        }
        
        .message {
            margin-bottom: 15px;
            padding: 15px 20px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideInUp 0.3s ease;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-message {
            background: var(--primary-color);
            color: white;
            margin-left: auto;
            text-align: right;
        }
        
        .bot-message {
            background: var(--light-color);
            color: var(--dark-color);
            border: 1px solid var(--border-color);
            margin-right: auto;
        }
        
        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid var(--border-color);
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .voice-button {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .voice-button:hover {
            background: #218838;
            transform: scale(1.05);
        }
        
        .voice-button.recording {
            background: var(--danger-color);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .send-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .send-button:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: var(--light-color);
            border-radius: 18px;
            margin-right: auto;
            max-width: 100px;
            border: 1px solid var(--border-color);
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--info-color);
            animation: typing 1.4s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        .menu-section {
            margin-bottom: 25px;
        }
        
        .menu-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .category-tab {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        
        .category-tab.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .category-tab:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .menu-item {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-color);
        }
        
        .item-image {
            width: 100%;
            height: 120px;
            background: var(--light-color);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--info-color);
        }
        
        .item-name {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .item-description {
            color: var(--info-color);
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item-price {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .item-category {
            background: var(--light-color);
            color: var(--info-color);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .add-to-cart {
            background: var(--success-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .add-to-cart:hover {
            background: #218838;
            transform: scale(1.05);
        }
        
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .status-available {
            background: var(--success-color);
            color: white;
        }
        
        .status-unavailable {
            background: var(--danger-color);
            color: white;
        }
        
        .toggle-sidebar {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 0 0 8px 8px;
            cursor: pointer;
            font-size: 18px;
        }
        
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: var(--shadow-lg);
        }
        
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                height: 100vh;
                z-index: 1000;
            }
            
            .sidebar.collapsed {
                transform: translateX(-100%);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .header {
                padding: 10px 20px;
            }
            
            .search-bar {
                max-width: 100%;
            }
            
            .chat-section {
                margin: 10px;
                border-radius: 10px;
            }
            
            .mobile-toggle {
                display: block;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-utensils"></i>
                    <span style="font-weight: bold;">Menu</span>
                </div>
                <button class="toggle-sidebar" onclick="toggleSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="sidebar-content">
                <!-- Categories -->
                <div class="menu-section">
                    <div class="menu-title">
                        <i class="fas fa-list"></i>
                        Categories
                    </div>
                    <div class="category-tabs">
                        <div class="category-tab active" onclick="filterCategory('all')">All</div>
                        <div class="category-tab" onclick="filterCategory('veg')">🥗 Vegetarian</div>
                        <div class="category-tab" onclick="filterCategory('non-veg')">🥩 Non-Veg</div>
                        <div class="category-tab" onclick="filterCategory('beverage')">🥤 Beverages</div>
                    </div>
                </div>
                
                <!-- Menu Items -->
                <div class="menu-section">
                    <div class="menu-title">
                        <i class="fas fa-fire"></i>
                        Popular Items
                    </div>
                    <div class="menu-grid" id="menuGrid">
                        <!-- Menu items will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-left">
                    <div class="logo">
                        🍅 Tomato
                    </div>
                    <div class="search-bar">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" placeholder="Search for food, drinks..." id="searchInput">
                    </div>
                </div>
                <div class="header-right">
                    <button class="cart-button" onclick="toggleCart()">
                        <i class="fas fa-shopping-cart"></i>
                        Cart
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                </div>
            </div>
            
            <!-- Content Area -->
            <div class="content-area">
                <!-- Chat Section -->
                <div class="chat-section">
                    <div class="chat-header">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-robot"></i>
                            <span style="font-weight: bold;">AI Assistant</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span id="dbStatus" style="font-size: 12px; padding: 4px 8px; border-radius: 10px; background: var(--warning-color); color: white;">
                                📴 Database
                            </span>
                        </div>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="message bot-message">
                            👋 Welcome to Tomato! I'm your AI assistant. I can help you with menu information, recommendations, and orders. How can I assist you today?
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <div class="input-container">
                            <input type="text" class="chat-input" placeholder="Type your message or use voice..." id="chatInput">
                            <button class="voice-button" id="voiceButton" onclick="toggleVoiceRecording()">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button class="send-button" onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i>
                                Send
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu Toggle -->
        <button class="mobile-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        // Global state
        let cart = [];
        let menuData = [];
        let currentCategory = 'all';
        let isRecording = false;
        let recognition;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadMenuData();
            initializeVoiceRecognition();
            updateCartCount();
        });
        
        // Voice Recognition
        function initializeVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
                
                recognition.onstart = function() {
                    isRecording = true;
                    document.getElementById('voiceButton').classList.add('recording');
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    if (transcript.trim()) {
                        document.getElementById('chatInput').value = transcript;
                        setTimeout(() => sendMessage(), 500);
                    }
                };
                
                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                    stopRecording();
                };
                
                recognition.onend = function() {
                    stopRecording();
                };
            }
        }
        
        function toggleVoiceRecording() {
            if (!recognition) {
                alert('Voice recognition is not supported in your browser. Please try Chrome or Firefox.');
                return;
            }
            
            if (isRecording) {
                stopRecording();
            } else {
                recognition.start();
            }
        }
        
        function stopRecording() {
            if (isRecording) {
                isRecording = false;
                document.getElementById('voiceButton').classList.remove('recording');
                if (recognition) {
                    recognition.stop();
                }
            }
        }
        
        // Menu Management
        async function loadMenuData() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();
                menuData = data.items || [];
                renderMenu();
                updateDatabaseStatus(true);
            } catch (error) {
                console.error('Failed to load menu:', error);
                // Load fallback data
                menuData = [
                    {name: "Margherita Pizza", category: "veg", price: 199, description: "Classic cheese pizza with fresh tomato sauce and basil.", available: true},
                    {name: "Farmhouse Pizza", category: "veg", price: 299, description: "Loaded with mushrooms, onions, tomatoes, and capsicum.", available: true},
                    {name: "Chicken Burger", category: "non-veg", price: 149, description: "Crispy chicken patty with lettuce, mayo, and cheese.", available: true},
                    {name: "Veg Burger", category: "veg", price: 99, description: "Spicy veg patty with cucumber and onion slices.", available: true},
                    {name: "Chocolate Shake", category: "beverage", price: 129, description: "Thick Belgian chocolate milkshake topped with whipped cream.", available: true}
                ];
                renderMenu();
                updateDatabaseStatus(false);
            }
        }
        
        function renderMenu() {
            const menuGrid = document.getElementById('menuGrid');
            const filteredData = currentCategory === 'all' ? menuData : menuData.filter(item => item.category === currentCategory);
            
            menuGrid.innerHTML = filteredData.map(item => `
                <div class="menu-item" onclick="addToCart('${item.name}', ${item.price})">
                    <div class="status-badge ${item.available ? 'status-available' : 'status-unavailable'}">
                        ${item.available ? '✓ Available' : '✗ Unavailable'}
                    </div>
                    <div class="item-image">
                        <i class="fas fa-utensils" style="font-size: 24px;"></i>
                    </div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-description">${item.description}</div>
                    <div class="item-footer">
                        <div class="item-category">${item.category}</div>
                        <div class="item-price">₹${item.price}</div>
                    </div>
                    <button class="add-to-cart" onclick="event.stopPropagation(); addToCart('${item.name}', ${item.price})">
                        <i class="fas fa-plus"></i> Add to Cart
                    </button>
                </div>
            `).join('');
        }
        
        function filterCategory(category) {
            currentCategory = category;
            
            // Update tab styles
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderMenu();
        }
        
        // Cart Management
        function addToCart(itemName, price) {
            const existingItem = cart.find(item => item.name === itemName);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({name: itemName, price: price, quantity: 1});
            }
            updateCartCount();
            showNotification(`${itemName} added to cart!`);
        }
        
        function updateCartCount() {
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }
        
        function toggleCart() {
            // Cart functionality can be implemented
            alert('Cart feature coming soon! Items in cart: ' + cart.length);
        }
        
        // Chat Functions
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            showTypingIndicator();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message, use_voice: false})
                });
                
                const data = await response.json();
                hideTypingIndicator();
                addMessage(data.reply);
                
                // Voice response
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(data.reply);
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    speechSynthesis.speak(utterance);
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('Sorry, I encountered an error. Please try again.');
            }
        }
        
        function addMessage(content, isUser = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.innerHTML = content;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function showTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.style.display = 'block';
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 3000);
            }
        }
        
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.style.display = 'none';
            }
        }
        
        // UI Functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }
        
        function updateDatabaseStatus(connected) {
            const status = document.getElementById('dbStatus');
            if (connected) {
                status.textContent = '🗄️ Database';
                status.style.background = 'var(--success-color)';
            } else {
                status.textContent = '📴 Database';
                status.style.background = 'var(--danger-color)';
            }
        }
        
        function showNotification(message) {
            // Simple notification (can be enhanced with toast library)
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--success-color);
                color: white;
                padding: 15px 20px;
                border-radius: 8px;
                z-index: 1002;
                animation: slideInRight 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            if (searchTerm.length > 2) {
                const filtered = menuData.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) ||
                    item.description.toLowerCase().includes(searchTerm) ||
                    item.category.toLowerCase().includes(searchTerm)
                );
                renderSearchResults(filtered);
            } else {
                renderMenu();
            }
        });
        
        function renderSearchResults(results) {
            const menuGrid = document.getElementById('menuGrid');
            if (results.length === 0) {
                menuGrid.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--info-color);">No items found matching your search.</div>';
            } else {
                menuGrid.innerHTML = results.map(item => `
                    <div class="menu-item" onclick="addToCart('${item.name}', ${item.price})">
                        <div class="item-name">${item.name}</div>
                        <div class="item-description">${item.description}</div>
                        <div class="item-price">₹${item.price}</div>
                    </div>
                `).join('');
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.add('collapsed');
            }
        });
    </script>
</body>
</html>
